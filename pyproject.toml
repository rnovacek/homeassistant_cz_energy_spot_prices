[project]
name = "homeassistant-cz-energy-spot-prices"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.2,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "habluetooth>=5.6.4",
    "homeassistant>=2026.5.2",
    "pillow>=11.3.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-homeassistant-custom-component>=0.13.331",
    # Runtime dependency declared in custom_components/.../manifest.json.
    # Listed here so that the test environment (which does not install manifest
    # ``requirements``) can import the integration.
    "defusedxml>=0.7.1",
    "aioesphomeapi>=45.0.2",
    "hassil>=3.5.0",
    "pysnmp>=7.1.27",
    "pymicro-vad==1.0.1",
    "pyspeex-noise==1.0.2",
    "home-assistant-intents>=2026.5.5",
    "pyrefly>=1.0.0",
    "pyturbojpeg>=2.2.0",
]

[tool.pyright]
reportUnannotatedClassAttribute = false
reportExplicitAny = false

[tool.pyrefly]
infer-with-first-use = false
