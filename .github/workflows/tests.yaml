name: Run python test suite

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  test:
    name: python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        run: uv sync --refresh --dev

      - name: Use latest compatible Home Assistant test stack
        run: >-
          uv pip install --upgrade
          --prerelease disallow
          homeassistant
          pytest-homeassistant-custom-component

      - name: List dependencies
        run: uv pip tree -d 1

      - name: Run tests
        # Do not let `uv run` resync the older lockfile over the upgraded
        # environment prepared above.
        run: uv run --no-sync pytest -vv
